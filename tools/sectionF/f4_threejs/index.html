<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F4 Bean Mirror Check</title>
<style>
  :root { --bg: #15171a; --fg: #e8e6e1; --mut: #9a978f; --acc: #f0a040; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
  #ui { padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  #ui label { color: var(--mut); }
  #ui select, #ui input { vertical-align: middle; }
  #out { color: var(--acc); font-variant-numeric: tabular-nums; }
  canvas { display: block; max-width: 100%; height: auto; }
  body.render #ui { display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "../../../render/engine/node_modules/three/build/three.module.js" } }
</script>
</head>
<body>
<div id="ui">
  <label>case <select id="case"></select></label>
  <label>her distance to the Bean (m) <input id="dist" type="range" min="0.05" max="18" step="0.05" value="10"> <span id="dv"></span></label>
  <label>view <select id="mode">
    <option value="0">normal</option>
    <option value="1">x-ray (her direct image at 30%, so the reflection behind her shows)</option>
    <option value="2">id (R her, G her reflection, B Bean)</option>
  </select></label>
  <label><input id="overlay" type="checkbox"> F4 frame 0 overlay</label>
  <span id="out"></span>
</div>
<canvas id="c"></canvas>
<script type="module">
// F4 Bean mirror check (v10). A ray-traced pass in a three.js ShaderMaterial on a full-screen quad:
// every pixel marches the scene (Bean + mannequin) by signed distance; a ray that hits the Bean is reflected about the
// exact surface normal (gradient of the Bean's implicit surface) and marched again, up to 3 bounces. So the reflection of
// the nearby mannequin is exact for this curved mirror (no environment-map approximation). The far world (plaza tiles,
// a ring of trees, a ring of buildings, sky) is analytic, intersected from the actual reflected ray origin.
import * as THREE from 'three';
import { CASES, pose } from './cases.js';

const qs = new URLSearchParams(location.search);
const RENDER = qs.has('render');
if (RENDER) document.body.classList.add('render');
const W = +(qs.get('w') || 960), H = +(qs.get('h') || 540);

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);

const uniforms = {
  res: { value: new THREE.Vector2(W, H) },
  camPos: { value: new THREE.Vector3() }, camR: { value: new THREE.Vector3() }, camU: { value: new THREE.Vector3() },
  camF: { value: new THREE.Vector3() }, focal: { value: 1.3 },
  headP: { value: new THREE.Vector3() }, bU: { value: new THREE.Vector3() }, bF: { value: new THREE.Vector3() },
  bL: { value: new THREE.Vector3() }, mode: { value: 0 }, ss: { value: 2 },
  overlay: { value: null }, useOverlay: { value: 0 },
  uJ: { value: Array.from({ length: 15 }, () => new THREE.Vector3()) }, uHF: { value: new THREE.Vector3() },
  plA: { value: new THREE.Vector3() }, plN: { value: new THREE.Vector3() }, plE1: { value: new THREE.Vector3() },
  plE2: { value: new THREE.Vector3() }, oscale: { value: 2.4 },
  uHU: { value: new THREE.Vector3() }, uTN: { value: [0, 1, 2].map(() => new THREE.Vector3()) }, uLN: { value: new THREE.Vector3() },
};

const frag = /* glsl */`
precision highp float;
uniform vec2 res; uniform vec3 camPos, camR, camU, camF; uniform float focal;
uniform vec3 headP, bU, bF, bL; uniform int mode; uniform int ss;
uniform vec3 plA, plN, plE1, plE2;   // mode 3: the plane her picture lies on (anchor, normal, picture right, picture up)
uniform float oscale;                // mode 4: orthographic view of the mannequin alone, metres per image height
uniform sampler2D overlay; uniform int useOverlay;
varying vec2 vUv;

// ---------------------------------------------------------------- the Bean (Cloud Gate): 20 m long (x), 13 m deep (z),
// 10 m tall, a superellipsoid with the omphalos arch cut out underneath (7 m half-span, 3.7 m high), standing on y = 0.
float beanF(vec3 p) {                      // implicit: < 0 inside. Used for hit refinement and the exact normal.
  vec3 q = vec3(p.x / 10.0, (p.y - 4.4) / 5.6, p.z / 6.5);
  float n = 2.6;
  float k = pow(pow(abs(q.x), n) + pow(abs(q.y), n) + pow(abs(q.z), n), 1.0 / n) - 1.0;
  float d = k * 4.0;
  float a = (length(vec2(p.x / 7.0, p.y / 3.7)) - 1.0) * 3.7;   // the arch (a tunnel along z)
  float h = clamp(0.5 - 0.5 * (d + a) / 0.8, 0.0, 1.0);        // smooth subtraction, k = 0.8 m
  d = mix(d, -a, h) + 0.8 * h * (1.0 - h);
  return max(d, -p.y);
}
vec3 beanN(vec3 p) {
  vec2 e = vec2(0.002, 0.0);
  return normalize(vec3(beanF(p + e.xyy) - beanF(p - e.xyy), beanF(p + e.yxy) - beanF(p - e.yxy), beanF(p + e.yyx) - beanF(p - e.yyx)));
}

// ---------------------------------------------------------------- the mannequin, articulated (v10b). Local frame: x = her
// LEFT, y = from her head toward her feet (straight body), z = her FRONT. Joints come from body() in cases.js (uJ, local,
// head centre at the origin): the spine, neck and head bend back (an arched back, head thrown back), the legs bow back.
// uJ: 0 head centre, 1 skull base, 2 shoulders (neck base), 3 waist, 4 pelvis, 5/8 hips L/R, 6/9 knees, 7/10 ankles,
// 11/12 hands L/R, 13/14 toes L/R. uHF/uHU: the head's front and crown directions. uTN: front normals of the neck,
// chest and belly segments; uLN: front normal of the shins.
uniform vec3 uJ[15];
uniform vec3 uHF, uHU, uTN[3], uLN;
float sdCap(vec3 p, vec3 a, vec3 b, float r) { vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); return length(pa - ba * h) - r; }
float capH(vec3 p, vec3 a, vec3 b) { vec3 pa = p - a, ba = b - a; return clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); }
vec3 toLocal(vec3 p) { vec3 q = p - headP; return vec3(dot(q, bL), dot(q, bU), dot(q, bF)); }
vec2 manL(vec3 q) {                     // (distance, part)
  vec2 r = vec2(length(q - uJ[0]) - 0.115, 1.0);                                   // head
  float d;
  d = sdCap(q, uJ[1], uJ[2], 0.055); if (d < r.x) r = vec2(d, 2.0);                 // neck
  d = sdCap(q, uJ[2] + vec3(0.07, 0.0, 0.0), uJ[3] + vec3(0.05, 0.0, 0.0), 0.12);
  d = min(d, sdCap(q, uJ[2] - vec3(0.07, 0.0, 0.0), uJ[3] - vec3(0.05, 0.0, 0.0), 0.12));
  if (d < r.x) r = vec2(d, 3.0);                                                    // chest (two capsules: wide)
  d = min(sdCap(q, uJ[3] + vec3(0.05, 0.0, 0.0), uJ[4] + vec3(0.06, 0.0, 0.0), 0.11),
          sdCap(q, uJ[3] - vec3(0.05, 0.0, 0.0), uJ[4] - vec3(0.06, 0.0, 0.0), 0.11));
  if (d < r.x) r = vec2(d, 4.0);                                                    // belly / hips
  d = min(sdCap(q, uJ[2] + vec3(0.15, 0.0, 0.0), uJ[11], 0.05), sdCap(q, uJ[2] - vec3(0.15, 0.0, 0.0), uJ[12], 0.05));
  if (d < r.x) r = vec2(d, 5.0);                                                    // arms out in a T
  d = length(q - uJ[11]) - 0.075; if (d < r.x) r = vec2(d, 6.0);                    // LEFT hand: cyan
  d = length(q - uJ[12]) - 0.075; if (d < r.x) r = vec2(d, 7.0);                    // RIGHT hand: magenta
  d = min(min(sdCap(q, uJ[5], uJ[6], 0.085), sdCap(q, uJ[6], uJ[7], 0.07)),
          min(sdCap(q, uJ[8], uJ[9], 0.085), sdCap(q, uJ[9], uJ[10], 0.07)));
  if (d < r.x) r = vec2(d, 8.0);                                                    // legs together
  d = min(sdCap(q, uJ[7], uJ[13], 0.06), sdCap(q, uJ[10], uJ[14], 0.06));
  if (d < r.x) r = vec2(d, 9.0);                                                    // shoes, toes to her front
  return r;
}
float manD(vec3 p) { return manL(toLocal(p)).x; }
vec3 manN(vec3 p) {
  vec2 e = vec2(0.001, 0.0);
  return normalize(vec3(manD(p + e.xyy) - manD(p - e.xyy), manD(p + e.yxy) - manD(p - e.yxy), manD(p + e.yyx) - manD(p - e.yyx)));
}
vec3 manColor(vec3 p) {
  vec3 q = toLocal(p);
  float part = manL(q).y;
  vec3 c;
  vec3 FRONT = vec3(1.0, 0.85, 0.1), BAND = vec3(1.0, 0.45, 0.05), BACK = vec3(0.07, 0.08, 0.2);
  if (part < 1.5) {                       // head: red, with a cream FACE disc (eyes toward the crown, a mouth) on her front
    c = vec3(0.85, 0.12, 0.1);
    vec3 v = q - uJ[0];
    if (dot(normalize(v), uHF) > 0.5) {
      c = vec3(1.0, 0.88, 0.72);
      vec2 f = vec2(v.x, dot(v, uHU));
      if (length(f - vec2(0.04, 0.025)) < 0.018 || length(f - vec2(-0.04, 0.025)) < 0.018) c = vec3(0.05);
      if (abs(f.x) < 0.035 && abs(f.y + 0.045) < 0.009) c = vec3(0.6, 0.1, 0.1);
    }
  } else if (part < 2.5) {                // neck: front cream (throat), back navy
    c = dot(q - mix(uJ[1], uJ[2], capH(q, uJ[1], uJ[2])), uTN[0]) > 0.0 ? vec3(1.0, 0.88, 0.72) : BACK;
  } else if (part < 3.5) {                // chest: FRONT yellow with an orange band; BACK navy with a white X
    float h = capH(q, uJ[2], uJ[3]);
    vec3 cp = mix(uJ[2], uJ[3], h);
    if (dot(q - cp, uTN[1]) > 0.0) c = abs(h - 0.35) < 0.08 ? BAND : FRONT;
    else {
      c = BACK;
      vec2 b = vec2(q.x, (h - 0.5) * 0.26);
      if ((abs(b.x - b.y * 1.1) < 0.03 || abs(b.x + b.y * 1.1) < 0.03) && abs(h - 0.5) < 0.45) c = vec3(0.95);
    }
  } else if (part < 4.5) {                // belly: FRONT yellow, BACK navy
    float h = capH(q, uJ[3], uJ[4]);
    c = dot(q - mix(uJ[3], uJ[4], h), uTN[2]) > 0.0 ? FRONT : BACK;
  } else if (part < 5.5) c = vec3(0.92);
  else if (part < 6.5) c = vec3(0.0, 0.85, 0.95);
  else if (part < 7.5) c = vec3(0.95, 0.1, 0.8);
  else if (part < 8.5) c = vec3(0.15, 0.3, 0.85);
  else c = vec3(0.1, 0.85, 0.2);
  return c;
}

// ---------------------------------------------------------------- the far world, analytic
float hash(float n) { return fract(sin(n) * 43758.5453); }
float cylExit(vec3 o, vec3 d, float R) {   // ray from inside a vertical cylinder about the Bean: distance to its wall
  vec2 oo = o.xz, dd = d.xz; float a = dot(dd, dd), b = dot(oo, dd), c = dot(oo, oo) - R * R;
  if (a < 1e-8) return 1e9; float h = b * b - a * c; if (h < 0.0) return 1e9; return (-b + sqrt(h)) / a;
}
vec3 env(vec3 o, vec3 d) {
  float tg = d.y < 0.0 ? -o.y / d.y : 1e9;
  float tt = cylExit(o, d, 48.0);
  vec3 pt = o + tt * d;
  float az = atan(pt.z, pt.x);
  float th = 6.5 + 1.2 * sin(az * 23.0) + 0.8 * sin(az * 57.0);
  if (tt < tg && pt.y < th) return mix(vec3(0.08, 0.32, 0.12), vec3(0.25, 0.6, 0.25), pt.y / th);   // trees
  float tb = cylExit(o, d, 130.0);
  vec3 pb = o + tb * d;
  float ab = atan(pb.z, pb.x), id = floor(ab * 9.0);
  float hb = 25.0 + 75.0 * hash(id + 3.0);
  if (tb < tg && pb.y < hb) {                                                                          // buildings
    vec3 bc = mix(vec3(0.55, 0.42, 0.32), vec3(0.75, 0.7, 0.62), hash(id + 7.0));
    float wx = fract(ab * 9.0 * 8.0), wy = fract(pb.y / 3.5);
    if (wx > 0.3 && wx < 0.7 && wy > 0.3 && wy < 0.75) bc *= 0.6;
    return bc;
  }
  if (tg < 1e8) {                                                                                      // plaza tiles
    vec3 pg = o + tg * d;
    vec2 g = fract(pg.xz / 1.5);
    vec3 tc = mix(vec3(0.8, 0.74, 0.74), vec3(0.72, 0.62, 0.7), hash(floor(pg.x / 1.5) * 7.1 + floor(pg.z / 1.5)));
    float line = step(0.94, max(g.x, g.y));
    float fog = clamp(tg / 300.0, 0.0, 1.0);
    return mix(mix(tc, vec3(0.25), line * (1.0 - fog)), vec3(0.8, 0.78, 0.76), fog);
  }
  return mix(vec3(0.85, 0.88, 0.95), vec3(0.3, 0.5, 0.9), clamp(d.y * 2.0, 0.0, 1.0));                // sky
}

// ---------------------------------------------------------------- tracing
// march: returns t and what was hit (0 none, 1 Bean, 2 mannequin). withMan: include the mannequin.
vec2 march(vec3 o, vec3 d, bool withMan, float tmax) {
  float t = 0.0;
  for (int i = 0; i < 400; i++) {
    vec3 p = o + t * d;
    float db = beanF(p);
    float dm = withMan ? manD(p) : 1e9;
    float s = min(db, dm);
    if (dm < 0.0008) return vec2(t, 2.0);
    if (db < 0.0015) {                    // refine the Bean hit by bisection on the implicit
      float a = max(t - 0.05, 0.0), b = t;
      if (beanF(o + a * d) > 0.0) { for (int k = 0; k < 20; k++) { float m = 0.5 * (a + b); if (beanF(o + m * d) > 0.0) a = m; else b = m; } t = b; }
      return vec2(t, 1.0);
    }
    t += max(min(db * 0.6, dm * 0.9), 0.0007);
    if (t > tmax) break;
  }
  return vec2(1e9, 0.0);
}
vec3 shadeMan(vec3 p) {
  vec3 n = manN(p);
  float l = 0.45 + 0.55 * max(dot(n, normalize(vec3(0.3, 0.8, 0.5))), 0.0);
  return manColor(p) * l;
}
// returns colour; flags.x = primary hit her, flags.y = a mirror bounce hit her, flags.z = primary hit the Bean
vec3 trace(vec3 o, vec3 d, bool primaryMan, out vec3 flags) {
  flags = vec3(0.0);
  vec3 att = vec3(1.0);
  for (int b = 0; b < 4; b++) {
    float tmax = 400.0;
    vec2 h = march(o, d, primaryMan || b > 0, tmax);
    if (h.y < 0.5) return att * env(o, d);
    vec3 p = o + h.x * d;
    if (h.y > 1.5) { if (b == 0) flags.x = 1.0; else flags.y = 1.0; return att * shadeMan(p); }
    if (b == 0) flags.z = 1.0;
    vec3 n = beanN(p);
    d = reflect(d, n);
    o = p + n * 0.004;
    att *= vec3(0.86, 0.89, 0.93);        // chrome: slightly cool and darker
  }
  return att * vec3(0.5);
}

// mode 3, the comp's reflection map: where the camera ray meets the Bean, the reflected ray is followed to the plane of
// her body (a flat cutout of her through her head, facing bF). Out: (x along her left, y from her head toward her feet,
// 1, 1) in metres, or zeros where the ray misses the Bean or the plane. One bounce; ignores Bean self-occlusion.
vec4 refmap(vec3 d) {
  vec2 h = march(camPos, d, false, 400.0);
  if (h.y < 0.5 || h.y > 1.5) return vec4(0.0);
  vec3 p = camPos + h.x * d;
  vec3 r = reflect(d, beanN(p));
  float den = dot(r, plN);
  if (abs(den) < 1e-5) return vec4(0.0);
  float t = dot(plA - p, plN) / den;
  if (t <= 0.0) return vec4(0.0);
  vec3 q = p + r * t - plA;
  return vec4(dot(q, plE1), dot(q, plE2), 1.0, 1.0);
}

void main() {
  if (mode == 4) {                       // the pose reference: her alone, orthographic, on white
    vec3 acc4 = vec3(0.0);
    for (int sy = 0; sy < 2; sy++) for (int sx = 0; sx < 2; sx++) {
      vec2 uv = (gl_FragCoord.xy + vec2(float(sx), float(sy)) * 0.5 - 0.25 - 0.5 * res) / res.y;
      vec3 o = camPos + (camR * uv.x + camU * uv.y) * oscale;
      float t = 0.0; vec3 c = vec3(1.0);
      for (int i = 0; i < 300; i++) {
        float dm = manD(o + t * camF);
        if (dm < 0.0008) { c = shadeMan(o + t * camF); break; }
        t += dm * 0.9;
        if (t > 60.0) break;
      }
      acc4 += c;
    }
    gl_FragColor = vec4(pow(acc4 / 4.0, vec3(1.0 / 1.15)), 1.0);
    return;
  }
  if (mode == 3) {
    vec2 uv = (gl_FragCoord.xy - 0.5 * res) / res.y;
    gl_FragColor = refmap(normalize(camF * focal + camR * uv.x + camU * uv.y));
    return;
  }
  vec3 acc = vec3(0.0), fl = vec3(0.0);
  for (int sy = 0; sy < 3; sy++) for (int sx = 0; sx < 3; sx++) {
    if (sx >= ss || sy >= ss) continue;
    vec2 px = gl_FragCoord.xy + (vec2(float(sx), float(sy)) + 0.5) / float(ss) - 0.5;
    vec2 uv = (px - 0.5 * res) / res.y;
    vec3 d = normalize(camF * focal + camR * uv.x + camU * uv.y);
    vec3 f;
    vec3 c;
    if (mode == 1) {                       // x-ray: her direct image at 30% over what is behind her
      vec3 f0; vec3 c0 = trace(camPos, d, false, f0);
      vec2 hm = march(camPos, d, true, 400.0);
      c = c0;
      if (hm.y > 1.5) { c = mix(c0, shadeMan(camPos + hm.x * d), 0.3); }
      f = f0;
    } else if (mode == 2) {
      vec3 f0; trace(camPos, d, false, f0);
      vec3 f1; trace(camPos, d, true, f1);
      f = vec3(f1.x, f0.y, f0.z);
      c = f;
    } else c = trace(camPos, d, true, f);
    acc += c;
  }
  vec3 col = acc / float(ss * ss);
  if (useOverlay == 1 && mode != 2) col = mix(col, texture2D(overlay, vUv).rgb, 0.45);
  gl_FragColor = vec4(mode == 2 ? col : pow(col, vec3(1.0 / 1.15)), 1.0);
}`;

const vert = `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
const mat = new THREE.ShaderMaterial({ uniforms, vertexShader: vert, fragmentShader: frag });
const scene = new THREE.Scene();
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

function setPose(P) {
  uniforms.camPos.value.fromArray(P.cam.pos); uniforms.camR.value.fromArray(P.cam.r);
  uniforms.camU.value.fromArray(P.cam.u); uniforms.camF.value.fromArray(P.cam.f); uniforms.focal.value = P.cam.focal;
  uniforms.headP.value.fromArray(P.head); uniforms.bU.value.fromArray(P.bU); uniforms.bF.value.fromArray(P.bF);
  uniforms.bL.value.fromArray(P.bL);
  P.body.J.forEach((j, i) => uniforms.uJ.value[i].fromArray(j));
  uniforms.uHF.value.fromArray(P.body.hf); uniforms.uHU.value.fromArray(P.body.hu);
  P.body.tn.forEach((n, i) => uniforms.uTN.value[i].fromArray(n));
  uniforms.uLN.value.fromArray(P.body.ln);
}
// render one view; returns a PNG data URL. opts: {case, dist, mode, ss}
window.renderView = (opts) => {
  const C = opts.override ? { ...CASES[opts.case], ...opts.override } : CASES[opts.case];
  const P = opts.frac != null ? pose(C, opts.frac * pose(C, -1).startDist) : pose(C, opts.dist);
  setPose(P);
  uniforms.mode.value = opts.mode || 0;
  uniforms.ss.value = opts.mode === 2 ? 1 : (opts.ss || 2);
  renderer.render(scene, cam);
  return { url: canvas.toDataURL('image/png'), pose: P };
};
// the comp's reflection map (mode 3) as float32 (x, y) in metres, cropped to where it is valid inside `box`
// [x0, y0, x1, y1] (image pixels, y down); plus where her crown and soles project (image pixels).
const rt = new THREE.WebGLRenderTarget(W, H, { type: THREE.FloatType, format: THREE.RGBAFormat,
  minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: false });
const project = (P, v) => {
  const c = P.cam, q = v.map((x, i) => x - c.pos[i]);
  const z = q[0] * c.f[0] + q[1] * c.f[1] + q[2] * c.f[2];
  const x = q[0] * c.r[0] + q[1] * c.r[1] + q[2] * c.r[2], y = q[0] * c.u[0] + q[1] * c.u[1] + q[2] * c.u[2];
  return [W / 2 + x / z * c.focal * H, H / 2 - y / z * c.focal * H];
};
window.renderMap = (opts) => {
  const C = CASES[opts.case];
  const P = pose(C, opts.frac * pose(C, -1).startDist);
  setPose(P);
  const V = opts.plane;      // {anchorL, nL, e1L, e2L} in her local frame (mirrorView in cases.js)
  const toW = v => [0, 1, 2].map(i => P.bL[i] * v[0] + P.bU[i] * v[1] + P.bF[i] * v[2]);
  uniforms.plA.value.fromArray(P.head.map((h, i) => h + toW(V.anchorL)[i]));
  uniforms.plN.value.fromArray(toW(V.nL)); uniforms.plE1.value.fromArray(toW(V.e1L)); uniforms.plE2.value.fromArray(toW(V.e2L));
  uniforms.mode.value = 3;
  renderer.setRenderTarget(rt);
  renderer.render(scene, cam);
  const [x0, y0, x1, y1] = opts.box;
  const w = x1 - x0, h = y1 - y0;
  const buf = new Float32Array(w * h * 4);
  renderer.readRenderTargetPixels(rt, x0, H - y1, w, h, buf);    // GL rows run bottom-up
  renderer.setRenderTarget(null);
  const xy = new Float32Array(w * h * 3);
  for (let r = 0; r < h; r++) for (let k = 0; k < w; k++) {
    const src = ((h - 1 - r) * w + k) * 4, dst = (r * w + k) * 3;
    xy[dst] = buf[src]; xy[dst + 1] = buf[src + 1]; xy[dst + 2] = buf[src + 2];
  }
  let s = '';
  const u8 = new Uint8Array(xy.buffer);
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  const add = (a, b, k) => a.map((v, i) => v + b[i] * k);
  // her crown (lowest point of her head) and the tops of her shoes (highest point of her feet), as the comp measures
  // them in the footage
  const Jw = P.body.J.map(j => toW(j).map((v, i) => v + P.head[i]));
  const feet = [7, 10, 13, 14].map(k => Jw[k]).reduce((a, b) => (a[1] > b[1] ? a : b));
  return { data: btoa(s), w, h, box: opts.box, crown: project(P, add(Jw[0], P.bU, -0.115)), soles: project(P, add(feet, P.bU, 0.06)),
           headc: project(P, P.head), pose: P };
};
// the pose reference (mode 4): the mannequin alone, orthographic along view direction V.fL (her local frame), centred on
// V.anchorL, V.e1L right and V.e2L up, oscale metres per image height. PNG data URL.
window.renderRef = (opts) => {
  const C = CASES[opts.case];
  const P = pose(C, opts.frac * pose(C, -1).startDist);
  setPose(P);
  const V = opts.plane;
  const toW = v => [0, 1, 2].map(i => P.bL[i] * v[0] + P.bU[i] * v[1] + P.bF[i] * v[2]);
  const f = toW(V.fL);
  uniforms.camPos.value.fromArray(P.head.map((h, i) => h + toW(V.anchorL)[i] - f[i] * 30));
  uniforms.camF.value.fromArray(f); uniforms.camR.value.fromArray(toW(V.e1L)); uniforms.camU.value.fromArray(toW(V.e2L));
  uniforms.oscale.value = opts.oscale || 2.4;
  uniforms.mode.value = 4;
  renderer.render(scene, cam);
  return canvas.toDataURL('image/png');
};
window.CASES = CASES;
window.isLost = () => renderer.getContext().isContextLost();

if (!RENDER) {
  const sel = document.getElementById('case');
  Object.keys(CASES).forEach(k => sel.add(new Option(`${k}: ${CASES[k].label}`, k)));
  const tex = new THREE.TextureLoader().load('f4_frame0.jpg', () => draw());
  uniforms.overlay.value = tex;
  const draw = () => {
    const dist = +document.getElementById('dist').value;
    document.getElementById('dv').textContent = dist.toFixed(2);
    uniforms.useOverlay.value = document.getElementById('overlay').checked ? 1 : 0;
    const r = window.renderView({ case: sel.value, dist, mode: +document.getElementById('mode').value, ss: 1 });
    document.getElementById('out').textContent = `camera ${r.pose.cam.pos.map(v => v.toFixed(1)).join(', ')} | head ${r.pose.head.map(v => v.toFixed(2)).join(', ')}`;
  };
  ['case', 'dist', 'mode', 'overlay'].forEach(id => document.getElementById(id).addEventListener('input', draw));
  draw();
}
window.ready = true;
</script>
</body>
</html>
