const heroU = smooth((T - SLOT2[0]) / (SLOT2[1] - SLOT2[0] - 0.25));

// ---------------------------------------------------------------- Jade, driving (the only colour in the frame)
const body = new THREE.Group(), head = new THREE.Group(); scene.add(body); scene.add(head);
{ const hip = V(-0.10, 0.60, -0.37), chest = V(-0.31, 0.98, -0.37);
  limb(body, hip, chest, 0.145, C.white);                                             // white cropped bomber
  limb(body, chest, HEADC.clone().add(V(0.0, -0.09, 0)), 0.05, C.black);              // black mock-neck
  const sh = { r: V(-0.30, 1.00, -0.20), l: V(-0.30, 1.00, -0.54) }, el = { r: V(-0.02, 0.83, -0.13), l: V(-0.02, 0.83, -0.61) };
  const hand = { r: rimPoint(62).addScaledVector(WHEEL_AX, 0.02), l: rimPoint(-62).addScaledVector(WHEEL_AX, 0.02) };   // ten and two
  for (const s of ['r', 'l']) {
    limb(body, sh[s], el[s], 0.052, C.white); limb(body, el[s], hand[s], 0.042, C.white);
    limb(body, sh[s].clone().lerp(el[s], 0.42), sh[s].clone().lerp(el[s], 0.62), 0.056, C.orange);   // the orange band on each sleeve
    ball(body, 0.045, C.skin, hand[s]);
  }
  ball(body, 0.03, '#2b3550', sh.l.clone().lerp(el.l, 0.25).add(V(0, 0.02, -0.045)), [1, 1, 0.4]);    // 1420 MHz roundel: her LEFT upper sleeve
  // orange headphones round her neck
  const nc = V(-0.30, 1.005, -0.37), R = 0.088, pts = []; for (let i = 0; i <= 12; i++) { const a = i / 12 * Math.PI; pts.push(nc.clone().add(V(-Math.sin(a) * R, 0, Math.cos(a) * R))); }
  body.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 24, 0.013, 8), mat(C.orange)));
  for (const s of [-1, 1]) { const c = new THREE.Mesh(new THREE.CylinderGeometry(0.046, 0.046, 0.04, 20), mat(C.orange)); c.rotation.x = Math.PI / 2; c.position.copy(nc).add(V(0.035, -0.025, s * R)); body.add(c); }
  // head: built facing +x, then turned a little towards the mirror
  head.position.copy(HEADC); head.rotation.y = -0.30; head.rotation.z = 0.06;
  ball(head, 0.105, C.skin, V(0, 0, 0)); ball(head, 0.113, C.hair, V(-0.024, 0.014, 0));               // black hair
  for (const s of [-1, 1]) { limb(head, V(0.062, 0.085, s * 0.05), V(0.058, -0.07, s * 0.098), 0.017, C.hair);                    // curtain bangs
    ball(head, 0.017, '#fbfbf7', V(0.091, 0.012, s * 0.04), [0.45, 0.8, 1]); ball(head, 0.011, '#3a3f4c', V(0.098, 0.012, s * 0.043), [0.45, 1, 1]);
    box(head, 0.006, 0.006, 0.04, C.black, 0.098, 0.04, s * 0.04, [s * 0.18, 0, 0]); }
  const bun = V(-0.085, 0.075, 0); ball(head, 0.056, C.hair, bun);
  // TWO pencils crossed in an X through the bun, erasers up, each one straight (graphite = pink eraser, rainbow = pale blue)
  for (const s of [-1, 1]) { const a = bun.clone().add(V(-0.02, -0.095, s * 0.07)), b = bun.clone().add(V(0.02, 0.105, -s * 0.07));
    limb(head, a, b, 0.0085, C.yellow); ball(head, 0.012, s > 0 ? '#e98fa6' : C.blue, b.clone().add(b.clone().sub(a).normalize().multiplyScalar(0.012))); }
  if (S.pov) { head.visible = false; }
}

// ---------------------------------------------------------------- mirrors (real planar reflections)
function planeBasis(n) { const x = new THREE.Vector3().crossVectors(V(0, 1, 0), n).normalize(), y = new THREE.Vector3().crossVectors(n, x); return new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, y, n)); }
const bisect = (M, a, b) => unit(a.clone().sub(M)).add(unit(b.clone().sub(M))).normalize();      // mirror normal that sends a's sight line to b
const nDriver = bisect(MIRROR, EYE, REAR_T);                                 // how she would set it
const nCamera = bisect(MIRROR, S.aimCam || S.pos, REAR_T);                   // re-aimed for the lens (what a film crew does)
const nMirror = AIM === 'camera' ? nCamera : nDriver;
function addMirror(M, n, w, h, res, housing, bez = 0) {
  const qn = planeBasis(n), glass = new Reflector(new THREE.PlaneGeometry(w, h), { textureWidth: res, textureHeight: Math.round(res * h / w), clipBias: 0.002, color: 0x8c8c8c, multisample: 4 });
  glass.position.copy(M); glass.quaternion.copy(qn); scene.add(glass);
  const up = V(0, 1, 0).applyQuaternion(qn);
  const hs = new THREE.Mesh(new THREE.BoxGeometry(w + 0.022, h + 0.022 + bez, 0.03), mat(housing)); hs.position.copy(M).addScaledVector(n, -0.0165).addScaledVector(up, -bez / 2); hs.quaternion.copy(qn); scene.add(hs);
  return { glass, qn, up };
}
const rv = addMirror(MIRROR, nMirror, MW, MH, 2048, '#18181b', BEZ);
limb(scene, MIRROR.clone().addScaledVector(nMirror, -0.03), V(0.37, 1.345, 0), 0.012, '#18181b');
addMirror(DOORM, bisect(DOORM, EYE, V(-22, 0.85, -3.2)), DW, DH, 1024, C.white);
if (S.etch) {   // the sung words, white-line letters on the mirror's lower bezel (where a real mirror carries its small print)
  const tex = canvasTex(2048, 2048 * (BEZ + 0.006) / MW, (c, w, h) => { c.font = `${Math.round(h * 0.86)}px Fell, serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
    try { c.letterSpacing = S.pov ? '6px' : '26px'; } catch (e) { /* older canvas */ }
    const m = c.measureText(S.etch).width, sx = Math.min(1, w * (S.pov ? 0.6 : 0.95) / m);   // from her own seat the lens ends inside the glass, so the line is set narrower
    c.fillStyle = '#f4f2ea'; c.translate(w / 2, h * 0.5); c.scale(sx, 1); c.fillText(S.etch, 0, 0); });
  const e = new THREE.Mesh(new THREE.PlaneGeometry(MW, BEZ + 0.006), new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: S.etchFade ?? 1, depthWrite: false }));
  e.position.copy(MIRROR).addScaledVector(nMirror, 0.0012).addScaledVector(rv.up, -MH / 2 - (BEZ + 0.006) / 2 - 0.001); e.quaternion.copy(rv.qn); e.renderOrder = 5; scene.add(e);
}

// ---------------------------------------------------------------- camera
const vfov = (h) => 2 * Math.atan(Math.tan(h * Math.PI / 360) / ASPECT) * 180 / Math.PI;
let camera;
if (PLAN) {
  camera = new THREE.OrthographicCamera(-2.5 * ASPECT, 2.5 * ASPECT, 2.5, -2.5, 0.1, 100); camera.position.set(-1.0, 30, 0); camera.up.set(1, 0, 0); camera.lookAt(-1.0, 0, 0);
  for (const o of car.children) if (o.position.y > 1.3) o.visible = false;
  const line = (pts, c) => { for (let i = 1; i < pts.length; i++) limb(scene, V(pts[i - 1].x, 2.2, pts[i - 1].z), V(pts[i].x, 2.2, pts[i].z), 0.012, glow(c)); };
  const refl = (from, n) => { const d = unit(MIRROR.clone().sub(from)); return MIRROR.clone().add(d.sub(n.clone().multiplyScalar(2 * d.dot(n))).multiplyScalar(9)); };
  line([EYE, MIRROR, refl(EYE, nMirror)], '#F08A24'); line([CAM_WIDE, MIRROR, refl(CAM_WIDE, nMirror)], '#8DB8E8');   // orange = her sight line, blue = the lens behind her shoulder
  ball(scene, 0.06, glow('#8DB8E8'), V(CAM_WIDE.x, 2.2, CAM_WIDE.z)); ball(scene, 0.035, glow('#F08A24'), V(EYE.x, 2.2, EYE.z));
} else {
  camera = new THREE.PerspectiveCamera(vfov(S.hfov), ASPECT, 0.02, 3000); camera.position.copy(S.pos); camera.lookAt(S.look);
}
camera.updateMatrixWorld(); renderer.render(scene, camera);

// ---------------------------------------------------------------- measurements
const px = (p) => { const v = p.clone().project(camera); return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H]; };
const mirrorPt = (p) => { const d = p.clone().sub(MIRROR).dot(nMirror); return p.clone().addScaledVector(nMirror, -2 * d); };   // where a point appears behind the glass
const local = (o, x, y) => o.localToWorld(V(x, y, 0));
hero.updateMatrixWorld(true); rv.glass.updateMatrixWorld(true);
const pl = [px(mirrorPt(local(hero.userData.plate, -0.1525, 0))), px(mirrorPt(local(hero.userData.plate, 0.1525, 0)))];
const mr = [px(local(rv.glass, -MW / 2, 0)), px(local(rv.glass, MW / 2, 0)), px(local(rv.glass, 0, MH / 2)), px(local(rv.glass, 0, -MH / 2))];

  heroPlateWidth_px: +Math.abs(pl[1][0] - pl[0][0]).toFixed(0), heroFront_x: +heroX.toFixed(1),
  mirrorCheat_deg: deg(nDriver.angleTo(nCamera)), mirrorYawFromStraightBack_deg: { driver: deg(Math.atan2(-nDriver.z, -nDriver.x)), camera: deg(Math.atan2(-nCamera.z, -nCamera.x)) } };
