<!doctype html>
<!-- Staging blockout for D7 / D8 (the ID card shots). Boxes only: it answers "where is the camera, where is her body,
     where is the card, what does the dialogue box cover", then the render is the composition reference for the keyframe.
     Car axes: +x = front of the car, +y = up, +z = the car's right (passenger) side. Left-hand drive: driver at z < 0.
     ?shot=D6|D7a|D7b|D7c|D8  &overlay=1 draws the 2.39 letterbox and the dialogue box rect of render/timeline/A.js. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/render/engine/node_modules/three/build/three.module.js"}}</script></head>
<body><script type="module">
import * as THREE from 'three';
const q = new URLSearchParams(location.search);
const SHOT = q.get('shot') || 'D7b', OVERLAY = q.get('overlay') === '1';
const W = 1920, H = 1080;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#1b1b1e');
scene.add(new THREE.HemisphereLight(0xffffff, 0x333340, 1.4));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(1.5, 2.5, 2); scene.add(key);

const V = (x, y, z) => new THREE.Vector3(x, y, z);
const mat = (c) => new THREE.MeshLambertMaterial({ color: c });
const add = (m) => { scene.add(m); return m; };
function box(w, h, d, c, x, y, z, rot) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c)); m.position.set(x, y, z); if (rot) m.rotation.set(...rot); return add(m); }
function ball(r, c, p) { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), mat(c)); m.position.copy(p); return add(m); }
function limb(a, b, r, c) {   // capsule from a to b
  const d = b.clone().sub(a), m = new THREE.Mesh(new THREE.CapsuleGeometry(r, d.length(), 6, 14), mat(c));
  m.position.copy(a).addScaledVector(d, 0.5); m.quaternion.setFromUnitVectors(V(0, 1, 0), d.clone().normalize()); return add(m);
}
const C = { seat: '#55565c', dash: '#3c3d42', door: '#46474d', white: '#f1efe9', orange: '#F08A24', blue: '#8DB8E8', black: '#141416', skin: '#f2c9a8',
  navy: '#1d2740', suit: '#0c0c0e', yellow: '#e8b53a', brass: '#b7ad98', glass: '#2a2b30' };

// ---------------------------------------------------------------- cabin (left-hand drive)
box(2.4, 0.04, 1.5, '#2b2c30', 0.2, 0.0, 0);                                   // floor
for (const z of [-0.37, 0.37]) {                                               // front seats
  box(0.50, 0.14, 0.48, C.seat, -0.02, 0.27, z);
  box(0.13, 0.62, 0.46, C.seat, -0.34, 0.62, z, [0, 0, 0.26]);
  box(0.09, 0.19, 0.24, C.seat, -0.44, 1.02, z, [0, 0, 0.2]);
}
box(0.5, 0.5, 1.4, C.seat, -1.0, 0.45, 0);                                     // rear bench
box(0.34, 0.42, 1.44, C.dash, 0.92, 0.55, 0);                                  // dashboard
box(0.30, 0.34, 0.24, C.dash, 0.30, 0.2, 0);                                   // centre console
const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.185, 0.018, 10, 40), mat('#101012'));
wheel.position.set(0.56, 0.74, -0.37); wheel.rotation.set(0, Math.PI / 2, 0); wheel.rotateX(0.42); add(wheel);
limb(V(0.56, 0.74, -0.37), V(0.84, 0.66, -0.37), 0.03, '#101012');             // steering column
for (const z of [-0.74, 0.74]) {                                               // doors below the window line + roof rail
  box(2.3, 0.72, 0.05, C.door, 0.1, 0.36, z);
  box(2.3, 0.05, 0.05, C.door, 0.1, 1.2, z);
  limb(V(0.95, 0.72, z), V(0.48, 1.2, z), 0.03, C.door);                       // A pillar
  limb(V(-0.32, 0.72, z), V(-0.36, 1.2, z), 0.035, C.door);                    // B pillar
}
box(2.0, 0.04, 1.5, '#2b2c30', -0.2, 1.23, 0);                                 // roof
box(0.012, 0.07, 0.24, C.glass, 0.52, 1.13, 0.0);                              // rearview mirror
// night outside: a few streetlight dots beyond the driver's window
for (let i = 0; i < 7; i++) ball(0.05, '#ffffff', V(-2 + i * 1.3, 1.5 + (i % 3) * 0.25, -7 - (i % 2) * 3));

// ---------------------------------------------------------------- Jade in the driver's seat
// yaw = how far she has turned toward her window (radians, about the vertical through her hips); the arms are posed
// per shot in car space afterwards.
const HIP = V(-0.02, 0.40, -0.37);
function jade(yaw = 0, showHead = true) {
  const G = new THREE.Group(); G.position.copy(HIP); G.rotation.y = yaw; scene.add(G);
  const keep = scene.children.length;
  const L = (x, y, z) => V(x, y, z);                                             // local to the hips, facing +x
  const chest = L(-0.08, 0.40, 0), neck = L(-0.08, 0.53, 0), head = L(-0.05, 0.64, 0);
  limb(L(0, 0, 0), chest, 0.13, C.black);                                        // black mock-neck top
  limb(L(0.02, 0.22, -0.11), L(-0.08, 0.47, -0.13), 0.085, C.white);             // jacket fronts (open)
  limb(L(0.02, 0.22, 0.11), L(-0.08, 0.47, 0.13), 0.085, C.white);
  limb(L(0.04, 0.34, -0.15), L(0.04, 0.34, -0.07), 0.05, C.orange);              // orange band, left front
  limb(L(0.04, 0.34, 0.07), L(0.04, 0.34, 0.15), 0.05, C.orange);                // orange band, right front
  ball(0.028, C.blue, L(0.055, 0.44, -0.10));                                    // pale-blue dot, her LEFT chest
  limb(chest, neck, 0.05, C.black);
  if (showHead) {
    ball(0.105, C.skin, head);
    ball(0.112, C.black, head.clone().add(V(-0.02, 0.012, 0)));                  // hair cap
    const bun = head.clone().add(V(-0.10, 0.07, 0)); ball(0.06, C.black, bun);
    // TWO pencils crossed in an X through the bun, erasers up, each one straight
    limb(bun.clone().add(V(-0.02, -0.09, 0.07)), bun.clone().add(V(0.02, 0.10, -0.07)), 0.008, C.yellow);
    limb(bun.clone().add(V(-0.02, -0.09, -0.07)), bun.clone().add(V(0.02, 0.10, 0.07)), 0.008, C.yellow);
    ball(0.011, '#e98fa6', bun.clone().add(V(0.02, 0.105, -0.072)));              // pink eraser = graphite pencil
    ball(0.011, C.blue, bun.clone().add(V(0.02, 0.105, 0.072)));                  // pale-blue eraser = rainbow pencil
  }
  const hp = new THREE.Mesh(new THREE.TorusGeometry(0.075, 0.028, 8, 24), mat(C.orange)); hp.position.copy(neck).add(V(0, -0.01, 0)); hp.rotation.x = Math.PI / 2; add(hp);
  for (const m of scene.children.splice(keep)) G.add(m);                         // move what we just built into the group
  G.updateMatrixWorld(true);
  const W_ = (x, y, z) => G.localToWorld(V(x, y, z));
  return { shR: W_(-0.08, 0.48, 0.17), shL: W_(-0.08, 0.48, -0.17), W: W_ };
}
limb(HIP, V(0.40, 0.36, -0.30), 0.075, C.navy); limb(V(0.40, 0.36, -0.30), V(0.62, 0.10, -0.30), 0.06, C.navy);   // legs
limb(HIP, V(0.40, 0.36, -0.46), 0.075, C.navy); limb(V(0.40, 0.36, -0.46), V(0.62, 0.10, -0.46), 0.06, C.navy);
function arm(sh, el, wr, patch) {
  limb(sh, el, 0.055, C.white); limb(el, wr, 0.05, C.white); ball(0.045, C.skin, wr);
  const d = el.clone().sub(sh).normalize(), mid = sh.clone().lerp(el, 0.55);
  limb(mid.clone().addScaledVector(d, -0.03), mid.clone().addScaledVector(d, 0.03), 0.058, C.orange);
  if (patch) ball(0.03, '#ffffff', sh.clone().lerp(el, 0.28).add(V(0, 0.02, -0.05)));   // 1420 MHz roundel, her LEFT sleeve (outboard)
}

// ---------------------------------------------------------------- the ID card: 86 x 54 mm, colour front, plain back
function cardTex(front) {
  const c = document.createElement('canvas'); c.width = 860; c.height = 540; const g = c.getContext('2d');
  g.fillStyle = '#fbfaf6'; g.fillRect(0, 0, 860, 540);
  if (front) {
    g.fillStyle = C.blue; g.fillRect(0, 0, 860, 120);
    g.fillStyle = '#d8dde6'; g.fillRect(50, 160, 250, 320);                    // photo
    g.fillStyle = '#141416'; g.beginPath(); g.arc(175, 270, 70, 0, 7); g.fill(); g.fillRect(95, 350, 160, 130);
    g.fillStyle = '#0b0b0c'; for (const [x, y, w] of [[350, 175, 440], [350, 255, 330], [350, 335, 400], [350, 415, 250]]) g.fillRect(x, y, w, 46);   // redaction bars
    g.fillStyle = '#fbfaf6'; g.fillRect(50, 36, 420, 48);
  } else {
    g.fillStyle = C.blue; g.fillRect(0, 0, 860, 36);
    g.fillStyle = '#0b0b0c'; g.fillRect(0, 90, 860, 96);                       // magnetic stripe
    g.fillStyle = '#e4e1d8'; g.fillRect(60, 250, 520, 70);                     // signature panel
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function card(pos, normal, upHint, scale = 1) {   // normal = the direction the FRONT faces
  const mats = [mat('#fbfaf6'), mat('#fbfaf6'), mat('#fbfaf6'), mat('#fbfaf6'),
    new THREE.MeshBasicMaterial({ map: cardTex(true) }), new THREE.MeshBasicMaterial({ map: cardTex(false) })];
  const m = new THREE.Mesh(new THREE.BoxGeometry(0.086 * scale, 0.054 * scale, 0.002), mats);
  const z = normal.clone().normalize(), x = upHint.clone().cross(z).normalize(), y = z.clone().cross(x);
  m.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, y, z)); m.position.copy(pos); return add(m);
}

// ---------------------------------------------------------------- the agent outside the driver's window
function agent(bend, cardHand, meterHand, headTilt = 0, base = V(0.22, -0.25, -1.08), hipH = 0.95) {
  const hipA = base.clone().add(V(0, hipH, 0));
  const up = V(0, Math.cos(bend), Math.sin(bend)).normalize();          // leaning in toward the window (+z)
  const shA = hipA.clone().addScaledVector(up, 0.55), headA = shA.clone().addScaledVector(up, 0.24);
  limb(base, hipA, 0.11, C.suit); limb(hipA, shA, 0.17, C.suit);
  limb(shA.clone().add(V(0, -0.02, 0.15)), shA.clone().add(V(0, -0.28, 0.17)), 0.02, '#f4f4f4');   // shirt + tie hint
  const hd = ball(0.10, '#e9e6de', headA); hd.rotation.z = headTilt;
  box(0.19, 0.035, 0.03, '#000', headA.x, headA.y + 0.015, headA.z + 0.095);   // shades
  const sL = shA.clone().add(V(0.2, 0, 0)), sR = shA.clone().add(V(-0.2, 0, 0));
  if (cardHand) { const e = sL.clone().lerp(cardHand, 0.5).add(V(0.08, -0.14, -0.05)); limb(sL, e, 0.05, C.suit); limb(e, cardHand, 0.045, C.suit); ball(0.045, '#e9e6de', cardHand); }
  if (meterHand) { const e = sR.clone().lerp(meterHand, 0.5).add(V(-0.08, -0.14, -0.05)); limb(sR, e, 0.05, C.suit); limb(e, meterHand, 0.045, C.suit); ball(0.045, '#e9e6de', meterHand);
    const mtr = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.02, 24), mat(C.brass)); mtr.position.copy(meterHand).add(V(0, 0.07, 0.03)); mtr.rotation.x = Math.PI / 2; add(mtr); }
  return { headA };
}

const cam = new THREE.PerspectiveCamera(40, W / H, 0.05, 60);
let note = '';
if (SHOT === 'D7a') {          // from the passenger seat, profile: she faces screen right, card drawn from the jacket
  const J = jade(0), hand = V(0.22, 0.80, -0.22);
  arm(J.shR, V(0.02, 0.66, -0.10), hand, false); arm(J.shL, V(0.05, 0.64, -0.60), V(0.12, 0.78, -0.45), true);
  card(hand.clone().add(V(0.035, 0.05, 0.0)), V(0.15, 0.1, 1), V(0.25, 1, 0), 1.25);
  agent(0.5, null, V(0.35, 0.95, -0.80));
  cam.fov = 40; cam.position.set(0.22, 0.95, 0.70); cam.lookAt(0.10, 0.86, -0.37);
  note = 'D7a: from the passenger seat, profile';
} else if (SHOT === 'D7b') {   // from the passenger-side dash, 3/4 front: her whole upper body, card at her chest
  const J = jade(0), hand = V(0.30, 0.80, -0.22);
  arm(J.shR, V(0.06, 0.63, -0.08), hand, false);                               // right hand holds the card up
  arm(J.shL, V(0.03, 0.62, -0.60), V(0.10, 0.74, -0.44), true);                // left hand still at the open jacket front
  card(hand.clone().add(V(0.03, 0.055, 0.0)), V(1, 0.12, 0.62), V(0, 1, 0), 1.3);
  agent(0.55, null, V(0.30, 0.95, -0.80));
  cam.fov = 40; cam.position.set(1.02, 0.98, 0.36); cam.lookAt(0.02, 0.88, -0.32);
  note = 'D7b: from the passenger-side dash, 3/4 front';
} else if (SHOT === 'D7c') {   // THE AGENT'S POINT OF VIEW through her open driver's window: she turns and holds the card up to us
  const J = jade(0.85), hand = V(0.22, 0.93, -0.66);
  arm(J.shL, V(0.12, 0.74, -0.62), hand, true);                                // her left arm, raised to the window
  arm(J.shR, V(0.14, 0.62, -0.22), V(0.30, 0.70, -0.34), false);               // right hand holding the jacket front open
  card(hand.clone().add(V(0.03, 0.065, -0.03)), V(0.18, 0.22, -1), V(0, 1, 0), 1.0);
  box(0.30, 0.04, 0.22, '#e9e6de', 0.0, 0.36, 0.37);                           // the dissertation on the passenger seat (C4)
  cam.fov = 46; cam.position.set(0.30, 1.10, -1.08); cam.lookAt(0.04, 0.93, -0.42);
  note = "D7c: the agent's point of view through her open driver's window";
} else if (SHOT === 'D6') {    // from the passenger seat, over her shoulder: the agents at HER driver's window, meter coming in.
  // Same direction of view as D8 (car front = screen right), so D6 -> D7 (reverse, their view) -> D8 (her view) is one place.
  const J = jade(0.45);
  arm(J.shR, V(0.16, 0.66, -0.16), V(0.44, 0.80, -0.26), false);               // both hands still on the wheel
  arm(J.shL, V(0.14, 0.66, -0.58), V(0.46, 0.84, -0.48), true);
  agent(0.7, null, V(0.36, 0.98, -0.80), 0.25, V(0.50, -0.25, -1.50), 0.75);   // nearer agent bends to the window, meter held in
  agent(0.35, null, null, 0, V(1.10, -0.25, -1.70), 0.80);                     // second agent beside him, toward the front of the car
  box(0.30, 0.04, 0.22, '#e9e6de', 0.0, 0.36, 0.37);                           // the dissertation on the passenger seat
  cam.fov = 52; cam.position.set(-0.42, 1.08, 0.58); cam.lookAt(0.42, 0.97, -0.80);
  note = "D6: from the passenger seat past her shoulder, agents at her driver's window";
} else if (SHOT === 'D8') {    // her point of view out of the driver's window: he reads the FRONT, we see only the BACK
  const J = jade(0.5, false);
  const ch = V(0.36, 0.86, -0.76), mh = V(0.00, 0.88, -0.86);
  const a = agent(0.7, ch, mh, 0.3, V(0.22, -0.25, -1.45), 0.75);
  cam.fov = 50; cam.position.set(0.02, 1.0, -0.30); cam.lookAt(0.22, 0.99, -0.95);
  // the FRONT faces him (and away from us): halfway between "toward his face" and "straight away from the camera"
  const n = a.headA.clone().sub(ch).normalize().add(ch.clone().sub(cam.position).normalize()).normalize();
  card(ch.clone().add(V(-0.03, 0.075, 0.0)), n, V(0, 1, 0), 1.0);
  note = "D8: her point of view through the driver's window";
}
cam.updateProjectionMatrix();
renderer.render(scene, cam);

if (OVERLAY) {   // what the engine puts on top: 2.39 letterbox + the dialogue box rect [150, 800, 1620, 200] (design px)
  const o = document.createElement('canvas'); o.width = W; o.height = H; o.style.cssText = 'position:absolute;left:0;top:0';
  const g = o.getContext('2d'); const bar = (H - W / 2.39) / 2, R = (q.get('rect') || '150,800,1620,200').split(',').map(Number);
  g.fillStyle = '#000'; g.fillRect(0, 0, W, bar); g.fillRect(0, H - bar, W, bar);
  g.fillStyle = 'rgba(236,231,220,0.92)'; g.fillRect(...R); g.strokeStyle = '#0b0b0c'; g.lineWidth = 4; g.strokeRect(...R);
  g.fillStyle = '#0b0b0c'; g.font = '46px serif'; g.fillText('I reach for my ID to show them and I do,', R[0] + 40, R[1] + 70);
  g.fillStyle = '#ffd24a'; g.font = '26px sans-serif'; g.fillText(note, 24, bar + 34);
  document.body.appendChild(o);
}
window.__ready = true;
</script></body></html>
